<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My New House · 영어 대화 학습</title>
<style>
:root{
  --bg:#F2F7FF; --panel:#FFFFFF; --ink:#14213D; --sub:#5B6B8C; --line:#C9D8F0;
  --jenny:#2F6FED; --marie:#D63A78; --tr:#0B7A75; --mark:#E5251B; --hl:#FFF1A8; --btn:#E4EDFC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1729; --panel:#18233D; --ink:#EAF0FF; --sub:#9DB0D6; --line:#2C3B5E;
    --jenny:#7FA8FF; --marie:#FF8DB5; --tr:#5FD6CE; --mark:#FF5A4F; --hl:#4A4310; --btn:#25345A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1729; --panel:#18233D; --ink:#EAF0FF; --sub:#9DB0D6; --line:#2C3B5E;
  --jenny:#7FA8FF; --marie:#FF8DB5; --tr:#5FD6CE; --mark:#FF5A4F; --hl:#4A4310; --btn:#25345A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
button:focus-visible{outline:3px solid var(--jenny);outline-offset:2px;}

header{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--line);background:var(--panel);}
.nav{width:42px;height:42px;border-radius:12px;background:var(--btn);font-size:20px;font-weight:800;}
.nav:disabled{opacity:.35;cursor:default;}
.tabs{display:flex;gap:6px;}
.tab{padding:9px 16px;border-radius:12px;background:var(--btn);font-weight:800;font-size:16px;}
.tab[aria-selected="true"]{background:var(--jenny);color:#fff;}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0F1729;}
.ask{margin-left:auto;padding:9px 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;font-size:17px;}

#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 12px 10px;overflow:hidden;font-size:var(--fs,30px);}
.row{flex:1 1 0;display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,.62fr);
  align-items:center;gap:0 .35em;border-bottom:1.5px dashed var(--line);padding:0 .1em;}
.row:last-child{border-bottom:none;}
.say{display:flex;align-items:baseline;gap:.4em;text-align:left;padding:.08em .15em;border-radius:.3em;line-height:1.18;min-width:0;}
.say.speaking,.tr.speaking{background:var(--hl);}
.who{flex:none;width:3.3em;font-size:.46em;font-weight:800;text-align:center;border-radius:.6em;padding:.1em 0;color:#fff;align-self:center;}
.who.Jenny{background:var(--jenny);} .who.Marie{background:var(--marie);}
:root[data-theme="dark"] .who{color:#0F1729;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .who{color:#0F1729;}}
.who.none{visibility:hidden;}
.txt{font-weight:700;overflow-wrap:anywhere;}
.txt.marked{text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:.11em;text-underline-offset:.14em;}
.ib{width:1.25em;height:1.25em;border-radius:50%;background:var(--btn);display:grid;place-items:center;}
.ib svg{width:55%;height:55%;fill:var(--sub);transition:fill .15s;}
.ib.on svg{fill:var(--tr);}
.star.on svg{fill:var(--mark);}
.tr{font-size:.52em;font-weight:700;color:var(--tr);line-height:1.25;padding:.15em .25em;border-radius:.4em;visibility:hidden;text-align:left;word-break:keep-all;min-width:0;cursor:pointer;}
.tr.on{visibility:visible;}

@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr) auto auto;}
  .tr{grid-column:1/-1;grid-row:2;font-size:.5em;}
}

#qm{position:fixed;inset:0;background:rgba(10,18,40,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;}
#qm.show{display:flex;}
.qbox{background:var(--panel);border-radius:24px;width:min(980px,100%);max-height:100%;overflow:auto;padding:28px 30px 30px;border:3px solid var(--ink);}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:var(--sub);font-weight:800;font-size:clamp(16px,2.4vmin,22px);}
.qx{width:44px;height:44px;border-radius:50%;background:var(--btn);font-size:22px;font-weight:800;}
.q{display:block;width:100%;text-align:left;font-weight:800;font-size:clamp(26px,6.2vmin,64px);line-height:1.3;padding:.3em .1em;border-bottom:2px dashed var(--line);word-break:keep-all;}
.q:last-child{border-bottom:none;}
.q.speaking{background:var(--hl);border-radius:12px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header>
  <button class="nav" id="prev" aria-label="이전 페이지">◀</button>
  <div class="tabs" id="tabs" role="tablist"></div>
  <button class="nav" id="next" aria-label="다음 페이지">▶</button>
  <button class="ask" id="ask">질문</button>
</header>
<main id="stage"></main>
<div id="qm" role="dialog" aria-modal="true" aria-label="질문">
  <div class="qbox">
    <div class="qhead"><span>질문 · 누르면 읽어줘요</span><button class="qx" id="qx" aria-label="닫기">✕</button></div>
    <div id="qlist"></div>
  </div>
</div>

<script>
const PAGES = [
 { q:['침실에는 무엇이 있나요?'],
   rows:[
    ['Jenny','Hello, Marie!','안녕하세요, 마리 이모!'],
    ['Marie','Hi, Jenny.','안녕, 제니야.'],
    ['','Can you see me?','이모가 보이니?'],
    ['Jenny','Yes, I can.','네, 보여요.'],
    ['Marie','This is my new house.','여기가 이모 새집이야.'],
    ['Jenny','What’s in the bedroom?','침실에는 뭐가 있어요?'],
    ['Marie','There is a bookshelf.','책장이 하나 있단다.']
   ]},
 { q:['소파와 식탁은 어디에 있나요?','무엇이 파란색이지요?'],
   rows:[
    ['Jenny','Where is the bed?','침대는 어디에 있어요?'],
    ['Marie','Here.','여기야.'],
    ['','Look at this.','이것 좀 보렴.'],
    ['Jenny','Wow!','우와!'],
    ['Marie','This is the living room.','여기는 거실이야.'],
    ['Jenny','What’s in the living room?','거실에는 뭐가 있어요?'],
    ['Marie','There is a sofa.','소파가 하나 있어.'],
    ['','There is a table, too.','식탁도 하나 있단다.'],
    ['Jenny','Oh, they’re blue.','아, 그것들은 파란색이네요.'],
    ['','My favorite color is blue.','제가 제일 좋아하는 색은 파란색이에요.']
   ]},
 { q:['이 집에는 정원이 있을까 없을까?'],
   rows:[
    ['Marie','And this is my garden.','그리고 여기는 이모 정원이야.'],
    ['','Can you see the flowers?','꽃들이 보이니?'],
    ['Jenny','Yes, I can.','네, 보여요.'],
    ['','They’re beautiful.','정말 예뻐요.'],
    ['Marie','Oh, no!','아, 안 돼!'],
    ['Jenny','Are you okay?','괜찮으세요?'],
    ['Marie','Yes, I’m okay.','응, 괜찮아.']
   ]}
];

const PITCH = { Jenny:1.12, Marie:0.92 };
const marks = new Set();       // 빨간 밑줄이 그어진 문장 (페이지-번호)
let cur = 0;

const $ = id => document.getElementById(id);
const stage = $('stage');
const SVG_TRI  = '<svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z" transform="rotate(90 12 12)"/></svg>';
const SVG_STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';

/* ---------- 읽어주기 ---------- */
function voiceFor(lang){
  const vs = speechSynthesis.getVoices();
  return vs.find(v => v.lang.replace('_','-') === lang) || vs.find(v => v.lang.toLowerCase().startsWith(lang.slice(0,2)));
}
function say(text, lang, pitch, el){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll('.speaking').forEach(n => n.classList.remove('speaking'));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang === 'ko-KR' ? 1 : 0.85; u.pitch = pitch || 1;
  const v = voiceFor(lang); if(v) u.voice = v;
  if(el) el.classList.add('speaking');
  const done = () => el && el.classList.remove('speaking');
  u.onend = done; u.onerror = done;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- 화면 그리기 ---------- */
function render(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  stage.innerHTML = '';
  let who = '';
  PAGES[cur].rows.forEach((r, i) => {
    if(r[0]) who = r[0];
    const key = cur + '-' + i, speaker = who;
    const row = document.createElement('div'); row.className = 'row';

    const sb = document.createElement('button'); sb.className = 'say';
    sb.setAttribute('aria-label', r[1] + ' 듣기');
    sb.innerHTML = `<span class="who ${r[0] ? r[0] : speaker + ' none'}">${r[0] ? r[0] : speaker}</span><span class="txt"></span>`;
    const txt = sb.querySelector('.txt'); txt.textContent = r[1];
    if(marks.has(key)) txt.classList.add('marked');
    sb.onclick = () => say(r[1], 'en-US', PITCH[speaker], sb);

    const tri = document.createElement('button'); tri.className = 'ib tri';
    tri.innerHTML = SVG_TRI; tri.setAttribute('aria-label', '해석 보기');

    const star = document.createElement('button'); star.className = 'ib star' + (marks.has(key) ? ' on' : '');
    star.innerHTML = SVG_STAR; star.setAttribute('aria-label', '밑줄 표시');
    star.onclick = () => {
      const on = !marks.has(key);
      on ? marks.add(key) : marks.delete(key);
      txt.classList.toggle('marked', on); star.classList.toggle('on', on);
    };

    const tr = document.createElement('div'); tr.className = 'tr'; tr.textContent = r[2];
    tri.onclick = () => { tr.classList.add('on'); tri.classList.add('on'); say(r[2], 'ko-KR', 1, tr); };
    tr.onclick = () => { if(tr.classList.contains('on')){ if('speechSynthesis' in window) speechSynthesis.cancel(); tr.classList.remove('on','speaking'); tri.classList.remove('on'); } };

    row.append(sb, tri, star, tr);
    stage.appendChild(row);
  });
  $('tabs').querySelectorAll('.tab').forEach((t, i) => t.setAttribute('aria-selected', i === cur));
  $('prev').disabled = cur === 0; $('next').disabled = cur === PAGES.length - 1;
  fit();
}

/* ---------- 스크롤 없이 화면에 꽉 차는 가장 큰 글씨 찾기 ---------- */
function fit(){
  let lo = 12, hi = 160;
  while(hi - lo > 1){
    const m = (lo + hi) >> 1;
    stage.style.setProperty('--fs', m + 'px');
    (stage.scrollHeight <= stage.clientHeight + 1 && stage.scrollWidth <= stage.clientWidth + 1) ? lo = m : hi = m;
  }
  stage.style.setProperty('--fs', lo + 'px');
}

/* ---------- 질문 ---------- */
function openQ(){
  const box = $('qlist'); box.innerHTML = '';
  PAGES[cur].q.forEach(q => {
    const b = document.createElement('button'); b.className = 'q'; b.textContent = q;
    b.onclick = () => say(q, 'ko-KR', 1, b);
    box.appendChild(b);
  });
  $('qm').classList.add('show');
}
function closeQ(){ if('speechSynthesis' in window) speechSynthesis.cancel(); $('qm').classList.remove('show'); }

/* ---------- 연결 ---------- */
PAGES.forEach((_, i) => {
  const t = document.createElement('button'); t.className = 'tab'; t.setAttribute('role', 'tab');
  t.textContent = (i + 1) + '페이지'; t.onclick = () => { cur = i; render(); };
  $('tabs').appendChild(t);
});
$('prev').onclick = () => { if(cur > 0){ cur--; render(); } };
$('next').onclick = () => { if(cur < PAGES.length - 1){ cur++; render(); } };
$('ask').onclick = openQ;
$('qx').onclick = closeQ;
$('qm').onclick = e => { if(e.target === $('qm')) closeQ(); };
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeQ();
  if(e.key === 'ArrowLeft') $('prev').click();
  if(e.key === 'ArrowRight') $('next').click();
});
let rz; window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fit); });
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
